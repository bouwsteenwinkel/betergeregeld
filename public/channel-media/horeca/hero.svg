<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1280" viewBox="0 0 1024 1280">
  <rect width="1024" height="1280" fill="#0f1b2d"/>
  <rect x="24" y="24" width="976" height="1232" fill="none" stroke="#1e3047" stroke-width="2"/>
  <circle cx="512" cy="150" r="40" fill="none" stroke="#f59e0b" stroke-width="3"/>
  <path d="M495 150l12 12 22-24" fill="none" stroke="#f59e0b" stroke-width="4" stroke-linecap="round"/>
  <text x="48" y="120" font-family="sans-serif" font-size="26" font-weight="700" fill="#e2e8f0">AI-BEELD — PREVIEW</text>
  <text x="48" y="156" font-family="monospace" font-size="16" fill="#f59e0b">branche: HORECA / slot: HERO</text>
  <text x="48" y="215" font-family="sans-serif" font-size="15" fill="#7e93ad">Dit beeld wordt gegenereerd met de volgende art-directed prompt:</text>
  <text x="48" y="250" font-family="monospace" font-size="15" fill="#cbd5e1">Het warme interieur van een Nederlands restaurant of</text><text x="48" y="276" font-family="monospace" font-size="15" fill="#cbd5e1">cafe vlak voor openingstijd, netjes gedekte tafels,</text><text x="48" y="302" font-family="monospace" font-size="15" fill="#cbd5e1">zacht avondlicht. Documentaire reportagefotografie,</text><text x="48" y="328" font-family="monospace" font-size="15" fill="#cbd5e1">eerlijk en ongeposeerd. Natuurlijk daglicht, echte</text><text x="48" y="354" font-family="monospace" font-size="15" fill="#cbd5e1">Nederlandse context en locatie. Echte texturen,</text><text x="48" y="380" font-family="monospace" font-size="15" fill="#cbd5e1">materialen en kleine imperfecties; niets</text><text x="48" y="406" font-family="monospace" font-size="15" fill="#cbd5e1">gladgestreken. Realistische, ingetogen kleuren; geen</text><text x="48" y="432" font-family="monospace" font-size="15" fill="#cbd5e1">oververzadiging, geen zware vignet of nep-bokeh.</text><text x="48" y="458" font-family="monospace" font-size="15" fill="#cbd5e1">Focus op handen, gereedschap, materiaal en de</text><text x="48" y="484" font-family="monospace" font-size="15" fill="#cbd5e1">werkomgeving in plaats van frontale gezichten, om</text>
  <text x="48" y="1230" font-family="monospace" font-size="13" fill="#52617a">fake-mode actief, zet OPENAI_API_KEY om echte foto's te genereren</text>
</svg>