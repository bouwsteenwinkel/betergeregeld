<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%"  stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- BG monogram -->
  <g transform="translate(80,80)">
    <rect width="120" height="120" rx="20" fill="#fff"/>
    <text x="60" y="86" text-anchor="middle"
          font-family="-apple-system,BlinkMacSystemFont,Inter,Helvetica,Arial,sans-serif"
          font-size="64" font-weight="900" fill="#0f172a">BG</text>
  </g>

  <!-- Wordmark + tagline -->
  <g transform="translate(80,310)">
    <text x="0" y="0"
          font-family="-apple-system,BlinkMacSystemFont,Inter,Helvetica,Arial,sans-serif"
          font-size="84" font-weight="900" fill="#fff" letter-spacing="-2">Beter Geregeld ICT</text>
    <text x="0" y="80"
          font-family="-apple-system,BlinkMacSystemFont,Inter,Helvetica,Arial,sans-serif"
          font-size="36" font-weight="500" fill="#94a3b8">Maatwerk websites · klantportalen · API-koppelingen</text>
    <text x="0" y="140"
          font-family="-apple-system,BlinkMacSystemFont,Inter,Helvetica,Arial,sans-serif"
          font-size="36" font-weight="500" fill="#94a3b8">Procesautomatisering · technische optimalisatie · sinds 1989</text>
  </g>

  <!-- footer line -->
  <line x1="80" y1="560" x2="1120" y2="560" stroke="#334155" stroke-width="1"/>
  <text x="80" y="595"
        font-family="-apple-system,BlinkMacSystemFont,Inter,Helvetica,Arial,sans-serif"
        font-size="24" font-weight="500" fill="#64748b">betergeregeld.com</text>
  <text x="1120" y="595" text-anchor="end"
        font-family="-apple-system,BlinkMacSystemFont,Inter,Helvetica,Arial,sans-serif"
        font-size="24" font-weight="500" fill="#64748b">T.B. Huurmanlaan 5 · Bussum</text>
</svg>
